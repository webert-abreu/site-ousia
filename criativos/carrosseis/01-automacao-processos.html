<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrossel 01 — Automação de Processos | Ousia Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Instrument+Serif:ital@0;1&family=Tenor+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0B0807; --bg-card: #1C1514; --bg-card-top: #221B1A;
      --border-subtle: #2B2120; --border-hairline: rgba(232, 226, 217, 0.14);
      --cream: #F8F5F0; --cream-soft: #E8E2D9; --tan: #D9CEC1;
      --muted: #C2B4A3; --muted-dim: #8A7A6D; --accent: #C28E68;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-page); color: var(--cream-soft); font-family: 'Tenor Sans', sans-serif;
      margin: 0; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }

    .top-navbar {
      width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 24px; border-bottom: 1px solid var(--border-hairline); margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
    }
    .nav-brand { display: flex; align-items: center; gap: 14px; }
    .nav-logo { height: 32px; width: auto; }
    .nav-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; color: var(--cream); font-weight: 600; }
    .nav-tag { font-family: 'Tenor Sans', sans-serif; font-size: 13px; color: var(--accent); letter-spacing: 0.05em; }

    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn-view {
      background: rgba(43,33,32,0.6); color: var(--muted); border: 1px solid var(--border-subtle);
      padding: 10px 18px; border-radius: 100px; font-family: 'Tenor Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-view.active, .btn-view:hover { background: var(--bg-card-top); color: var(--cream); border-color: var(--tan); }
    .btn-download-all {
      background: #C28E68; color: #FFFFFF; font-family: 'Tenor Sans', sans-serif; font-size: 13px; font-weight: 700;
      border: none; padding: 10px 24px; border-radius: 100px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 10px 25px rgba(194,142,104,0.3); transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn-download-all:hover { transform: translateY(-2px); opacity: 0.95; }

    /* MODO CARROSSEL SLIDER INTERATIVO */
    .slider-view-wrapper {
      display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 600px;
    }
    .slider-controls { display: flex; align-items: center; gap: 20px; }
    .btn-arrow {
      background: var(--bg-card); color: var(--cream); border: 1px solid var(--border-subtle);
      width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease; font-size: 18px;
    }
    .btn-arrow:hover { background: var(--accent); border-color: var(--accent); }
    .btn-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
    .slide-progress { font-family: 'Tenor Sans', sans-serif; font-size: 15px; color: var(--accent); letter-spacing: 0.08em; font-weight: 600; }

    .iframe-scaler-single {
      width: 456px; height: 570px; position: relative; overflow: hidden; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8); border: 1px solid var(--border-subtle);
    }
    .iframe-scaler-single iframe {
      width: 1080px; height: 1350px; border: none; transform: scale(0.4222); transform-origin: top left;
    }

    /* MODO GRADE / FILEIRA (TODOS OS 5 SLIDES) */
    .grid-view-wrapper {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; width: 100%; max-width: 1300px;
    }
    .grid-card {
      display: flex; flex-direction: column; align-items: center; gap: 12px; background: var(--bg-card);
      padding: 16px; border-radius: 14px; border: 1px solid var(--border-subtle);
    }
    .grid-card-title { font-family: 'Tenor Sans', sans-serif; font-size: 13px; color: var(--tan); letter-spacing: 0.04em; }

    .iframe-scaler-grid {
      width: 216px; height: 270px; position: relative; overflow: hidden; border-radius: 8px;
      border: 1px solid var(--border-hairline);
    }
    .iframe-scaler-grid iframe {
      width: 1080px; height: 1350px; border: none; transform: scale(0.2); transform-origin: top left; pointer-events: none;
    }

    .btn-download-single {
      background: transparent; color: var(--tan); border: 1px solid var(--border-hairline);
      padding: 6px 14px; border-radius: 100px; font-family: 'Tenor Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-download-single:hover { background: var(--accent); color: #FFF; border-color: var(--accent); }
  </style>
</head>
<body>

  <!-- BARRA DE AÇÕES -->
  <header class="top-navbar">
    <div class="nav-brand">
      <img src="../assets/logos/logo-ousia-creme-transparente.png" alt="Ousia" class="nav-logo" />
      <div>
        <h1 class="nav-title">Carrossel — Automação de Processos</h1>
        <span class="nav-tag">5 Slides Autorais • Resolução 1080x1350</span>
      </div>
    </div>

    <div class="nav-actions">
      <button class="btn-view active" id="btnSingleMode" onclick="switchMode('single')">Modo Slide</button>
      <button class="btn-view" id="btnGridMode" onclick="switchMode('grid')">Modo Grade (Todos)</button>
      <button class="btn-download-all" id="btnDownloadAll" onclick="downloadAllSlides()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/></svg>
        <span>Baixar Todos (5 PNGs)</span>
      </button>
    </div>
  </header>

  <!-- MODO SLIDE INTERATIVO -->
  <div id="singleContainer" class="slider-view-wrapper">
    <div class="slider-controls">
      <button class="btn-arrow" id="btnPrev" onclick="changeSlide(-1)">&larr;</button>
      <span class="slide-progress" id="slideNumIndicator">Slide 01 / 05</span>
      <button class="btn-arrow" id="btnNext" onclick="changeSlide(1)">&rarr;</button>
    </div>

    <div class="iframe-scaler-single">
      <iframe id="singleFrame" src="slides/01-automacao-slide-1.html"></iframe>
    </div>

    <button class="btn-download-single" onclick="downloadCurrentSlide()">Baixar Este Slide em PNG</button>
  </div>

  <!-- MODO GRADE / FILEIRA (TODOS OS SLIDES) -->
  <div id="gridContainer" class="grid-view-wrapper" style="display: none;">
    <div class="grid-card">
      <span class="grid-card-title">01. Capa (Hook)</span>
      <div class="iframe-scaler-grid"><iframe id="frameSlide1" src="slides/01-automacao-slide-1.html"></iframe></div>
      <button class="btn-download-single" onclick="downloadSpecificSlide('frameSlide1')">Baixar PNG</button>
    </div>

    <div class="grid-card">
      <span class="grid-card-title">02. O Problema</span>
      <div class="iframe-scaler-grid"><iframe id="frameSlide2" src="slides/01-automacao-slide-2.html"></iframe></div>
      <button class="btn-download-single" onclick="downloadSpecificSlide('frameSlide2')">Baixar PNG</button>
    </div>

    <div class="grid-card">
      <span class="grid-card-title">03. A Solução</span>
      <div class="iframe-scaler-grid"><iframe id="frameSlide3" src="slides/01-automacao-slide-3.html"></iframe></div>
      <button class="btn-download-single" onclick="downloadSpecificSlide('frameSlide3')">Baixar PNG</button>
    </div>

    <div class="grid-card">
      <span class="grid-card-title">04. O Impacto</span>
      <div class="iframe-scaler-grid"><iframe id="frameSlide4" src="slides/01-automacao-slide-4.html"></iframe></div>
      <button class="btn-download-single" onclick="downloadSpecificSlide('frameSlide4')">Baixar PNG</button>
    </div>

    <div class="grid-card">
      <span class="grid-card-title">05. Chamada de Ação</span>
      <div class="iframe-scaler-grid"><iframe id="frameSlide5" src="slides/01-automacao-slide-5.html"></iframe></div>
      <button class="btn-download-single" onclick="downloadSpecificSlide('frameSlide5')">Baixar PNG</button>
    </div>
  </div>

  <script>
    let currentSlideIndex = 1;
    const totalSlides = 5;
    const slidesSources = [
      'slides/01-automacao-slide-1.html',
      'slides/01-automacao-slide-2.html',
      'slides/01-automacao-slide-3.html',
      'slides/01-automacao-slide-4.html',
      'slides/01-automacao-slide-5.html'
    ];

    function changeSlide(direction) {
      currentSlideIndex += direction;
      if (currentSlideIndex < 1) currentSlideIndex = 1;
      if (currentSlideIndex > totalSlides) currentSlideIndex = totalSlides;

      document.getElementById('singleFrame').src = slidesSources[currentSlideIndex - 1];
      document.getElementById('slideNumIndicator').innerText = `Slide 0${currentSlideIndex} / 05`;
      document.getElementById('btnPrev').disabled = (currentSlideIndex === 1);
      document.getElementById('btnNext').disabled = (currentSlideIndex === totalSlides);
    }

    function switchMode(mode) {
      const singleC = document.getElementById('singleContainer');
      const gridC = document.getElementById('gridContainer');
      const btnS = document.getElementById('btnSingleMode');
      const btnG = document.getElementById('btnGridMode');

      if (mode === 'single') {
        singleC.style.display = 'flex'; gridC.style.display = 'none';
        btnS.classList.add('active'); btnG.classList.remove('active');
      } else {
        singleC.style.display = 'none'; gridC.style.display = 'grid';
        btnG.classList.add('active'); btnS.classList.remove('active');
      }
    }

    function downloadCurrentSlide() {
      const iframe = document.getElementById('singleFrame');
      if (iframe && iframe.contentWindow && iframe.contentWindow.triggerPngDownload) {
        iframe.contentWindow.triggerPngDownload();
      }
    }

    function downloadSpecificSlide(iframeId) {
      const iframe = document.getElementById(iframeId);
      if (iframe && iframe.contentWindow && iframe.contentWindow.triggerPngDownload) {
        iframe.contentWindow.triggerPngDownload();
      }
    }

    async function downloadAllSlides() {
      const btn = document.getElementById('btnDownloadAll');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>Baixando 5 Slides...</span>'; btn.style.opacity = '0.7';

      const frames = ['frameSlide1', 'frameSlide2', 'frameSlide3', 'frameSlide4', 'frameSlide5'];

      for (let i = 0; i < frames.length; i++) {
        const iframe = document.getElementById(frames[i]);
        if (iframe && iframe.contentWindow && iframe.contentWindow.triggerPngDownload) {
          await iframe.contentWindow.triggerPngDownload();
          // Pequena pausa entre cada download para não bloquear o navegador
          await new Promise(r => setTimeout(r, 600));
        }
      }

      btn.innerHTML = originalText; btn.style.opacity = '1';
    }

    // Inicializa botões
    changeSlide(0);
  </script>
</body>
</html>
