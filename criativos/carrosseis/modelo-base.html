<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Carrosseis | Ousia Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Tenor+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0B0807; --bg-card: #1C1514; --bg-card-top: #221B1A;
      --border-subtle: #2B2120; --border-hairline: rgba(232, 226, 217, 0.14);
      --cream: #F8F5F0; --tan: #D9CEC1; --muted: #C2B4A3; --accent: #C28E68;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-page); color: var(--cream); font-family: 'Tenor Sans', sans-serif;
      padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }

    .header-bar { text-align: center; margin-bottom: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .tag { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--accent); }
    .title { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 600; }

    .carousel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; width: 100%; max-width: 1000px; }
    .card-item {
      background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 28px; border-radius: 16px;
      display: flex; flex-direction: column; gap: 16px; transition: transform 0.2s ease, border-color 0.2s ease;
      text-decoration: none; color: inherit;
    }
    .card-item:hover { transform: translateY(-4px); border-color: var(--accent); }
    .card-tag { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--accent); }
    .card-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: var(--cream); }
    .card-desc { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .card-link { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--tan); display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

  <header class="header-bar">
    <span class="tag">✦ STUDIO DE CRIATIVOS</span>
    <h1 class="title">Central de Carrosseis para Instagram</h1>
  </header>

  <main class="carousel-grid">
    <a href="01-automacao-processos.html" class="card-item">
      <span class="card-tag">CARROSSEL 01 (5 SLIDES)</span>
      <h2 class="card-title">Automação de Processos &amp; Vendas</h2>
      <p class="card-desc">Carrossel completo sobre inteligência de atendimento, CRM e conversão fluida sem erros manuais.</p>
      <span class="card-link">Abrir e Baixar PNGs &rarr;</span>
    </a>
  </main>

</body>
</html>
